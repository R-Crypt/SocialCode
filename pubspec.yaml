name: social_code
description: "The Social Code — Good is the new flex."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # Backend
  supabase_flutter: ^2.8.1
  google_sign_in: ^6.2.2
  
  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  
  # UI / Fonts
  google_fonts: ^8.0.2
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  shimmer: ^3.0.0
  
  # Media
  image_picker: ^1.2.1
  
  # Location / Maps (OpenStreetMap - no API key needed)
  geolocator: ^14.0.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  
  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  path: ^1.9.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
